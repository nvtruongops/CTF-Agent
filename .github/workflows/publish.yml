name: Verify and stage npm release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'npm tag (e.g. latest, beta)'
        required: true
        default: 'latest'

permissions:
  contents: read
  id-token: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Run Linux runtime as its non-sudo account
        run: |
          sudo useradd --create-home --shell /bin/bash ctfagent
          sudo chmod o+x "$HOME"
          sudo -u ctfagent env PATH="$PATH" npm run prepublishOnly
          sudo -u ctfagent env PATH="$PATH" npm run verify:package
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest .agents/tests

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      - run: npm ci
      - run: npm test

  stage:
    needs: [linux, windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - run: npm install --global npm@11.21.1

      - run: npm ci

      - run: npm run prepublishOnly

      - run: npm run verify:package

      - name: Stage for maintainer review and 2FA approval
        run: npm stage publish --tag "$env:NPM_TAG" --provenance --access public
        env:
          NPM_TAG: ${{ github.event.inputs.tag || 'latest' }}
